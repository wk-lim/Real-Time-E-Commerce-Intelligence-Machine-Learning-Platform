name: ecommerce-intelligence-platform

services:
  phase0-check:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command:
      - python
      - -c
      - >-
        import platform;
        print("Phase 0 container is ready");
        print(f"Python {platform.python_version()}")

  spark-ivy-init:
    image: spark:${SPARK_VERSION:-4.2.0}-java21-python3
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - chown -R spark:spark /tmp/spark-ivy
    volumes:
      - spark-ivy:/tmp/spark-ivy
    restart: "no"

  spark:
    image: spark:${SPARK_VERSION:-4.2.0}-java21-python3
    hostname: spark
    init: true
    depends_on:
      kafka:
        condition: service_healthy
      spark-ivy-init:
        condition: service_completed_successfully
    working_dir: /opt/project
    environment:
      PYTHONPATH: /opt/project/src
    ports:
      - "${SPARK_UI_PORT:-4040}:4040"
    volumes:
      - .:/opt/project
      - spark-ivy:/tmp/spark-ivy
    command:
      - /bin/bash
      - -lc
      - sleep infinity

  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:19092
        --create --if-not-exists
        --topic ecommerce.events.v1
        --partitions 6
        --replication-factor 1
        --config retention.ms=604800000
        &&
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:19092
        --create --if-not-exists
        --topic ecommerce.products.v1
        --partitions 3
        --replication-factor 1
        --config cleanup.policy=compact
        &&
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:19092
        --create --if-not-exists
        --topic ecommerce.events.dlq.v1
        --partitions 3
        --replication-factor 1
        --config retention.ms=2592000000
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.6}
    hostname: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
  airflow-db:
    image: postgres:16
    hostname: airflow-db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
  airflow-init:
    image: apache/airflow:3.3.2
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow"
    command: ["db", "migrate"]
    restart: "no"
  airflow-api-server:
    image: apache/airflow:3.3.2
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    command: ["api-server"]
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/api/v2/monitor/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
  airflow-scheduler:
    image: ecommerce-airflow:3.3.2
    depends_on:
      airflow-api-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      POSTGRES_HOST: postgres
      POSTGRES_HOST_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./data/processed/bronze:/opt/project/data/processed/bronze:ro
    command: ["scheduler"]
    restart: unless-stopped
  airflow-dag-processor:
    image: ecommerce-airflow:3.3.2
    depends_on:
      airflow-api-server:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
    volumes:
      - ./dags:/opt/airflow/dags:ro
    command: ["dag-processor"]
    restart: unless-stopped

volumes:
  kafka-data:
  spark-ivy:
  postgres-data:
  airflow-db-data:
