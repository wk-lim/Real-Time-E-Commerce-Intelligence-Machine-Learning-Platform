version: 2

models:
  - name: fct_daily_event_activity
    description: >
      Event counts by source-reported calendar date and event type.
      The source timestamp's timezone is unknown; this is not a UTC date.
    columns:
      - name: event_date_source
        data_tests: [not_null]
      - name: event_type
        data_tests: [not_null]
      - name: event_count
        data_tests: [not_null]