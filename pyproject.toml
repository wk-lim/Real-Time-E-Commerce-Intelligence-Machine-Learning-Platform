[project]
name = "real-time-ecommerce-intelligence"
version = "0.1.0"
description = "A real-time e-commerce data and machine-learning platform."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "confluent-kafka==2.15.*",
    "jsonschema[format]==4.26.*",
    "pyarrow==25.0.*",
]

[project.scripts]
ecommerce-replay = "ecommerce_intelligence.ingestion.replay:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.*",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
